<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- BUILD: v19-toggleable-import-rules -->
<title>PE Programme Planner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#1c2321;
  --paper:#f6f5f0;
  --panel:#ffffff;
  --line:#dcdad0;
  --court:#2f6d5e;       /* deep court green — signature colour */
  --court-dim:#e6efec;
  --clay:#c76a3e;        /* whistle-orange accent */
  --clay-dim:#f6e3d8;
  --gold:#c9a13b;
  --danger:#b3432f;
  --danger-dim:#fbe4de;
  --muted:#6c7570;
  --radius:10px;
  font-family: "Iowan Old Style","Palatino Linotype",Georgia,serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
body{font-family:"Charter","Iowan Old Style",Georgia,serif;-webkit-font-smoothing:antialiased;}
.mono{font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;letter-spacing:.2px;margin:0;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:"IBM Plex Mono",Menlo,monospace;font-size:13.5px;}

/* ---------- layout shell ---------- */
#app{display:none;min-height:100vh;grid-template-columns:220px 1fr;}
#app.ready{display:grid;}
.sidebar{background:var(--ink);color:#eae7dd;padding:22px 16px;display:flex;flex-direction:column;gap:4px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:0 6px;}
.brand .mark{width:30px;height:30px;border-radius:50%;background:var(--court);position:relative;flex:none;}
.brand .mark::after{content:"";position:absolute;inset:6px;border:2px solid #eae7dd;border-radius:50%;}
.brand .name{font-size:15px;line-height:1.15;}
.brand .name b{display:block;font-size:16px;}
.brand .name span{font-size:11px;color:#9a998f;font-family:"IBM Plex Mono",monospace;letter-spacing:.5px;}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:#cfccc0;text-align:left;font-size:14px;}
.navbtn:hover{background:#2a3330;color:#fff;}
.navbtn.active{background:var(--court);color:#fff;}
.navbtn .num{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#8f9c96;width:16px;}
.navbtn.active .num{color:#d8ede7;}
.sidebar-foot{margin-top:auto;padding:10px 6px 0;border-top:1px solid #33403c;font-size:12px;color:#9a998f;}
.sidebar-foot button{background:none;border:none;color:#cfccc0;text-decoration:underline;padding:0;font-size:12px;margin-top:6px;}

.main{padding:28px 34px 60px;overflow-x:auto;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.pagehead h2{font-size:24px;}
.pagehead .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--court);margin-bottom:2px;}
.pagehead p.sub{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:60ch;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
.panel h3{font-size:14px;text-transform:uppercase;letter-spacing:.8px;font-family:"IBM Plex Mono",monospace;color:var(--muted);margin-bottom:14px;font-weight:600;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.row > *{flex:1 1 160px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.4px;}
input[type=text],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{
  padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--court);outline-offset:0;border-color:var(--court);}
.btn{padding:8px 16px;border-radius:7px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13.5px;white-space:nowrap;}
.btn:hover{background:#333d39;}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.secondary:hover{border-color:var(--ink);}
.btn.danger{background:var(--danger);border-color:var(--danger);}
.btn.danger:hover{background:#96382a;}
.btn.small{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid #ececE4;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-family:"IBM Plex Mono",monospace;}
.tag.green{background:var(--court-dim);color:var(--court);}
.tag.clay{background:var(--clay-dim);color:var(--clay);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;background:var(--court-dim);color:var(--court);margin:2px 4px 2px 0;font-family:"IBM Plex Mono",monospace;}
.pill button{background:none;border:none;color:inherit;font-size:12px;padding:0;line-height:1;}
.empty{color:var(--muted);font-size:13px;padding:18px 4px;text-align:center;border:1px dashed var(--line);border-radius:8px;}
.hint{font-size:12px;color:var(--muted);margin-top:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:900px){.grid2{grid-template-columns:1fr;}}

/* status colors for calendar/grid */
.status-available{background:#fff;}
.status-occupied{background:var(--court-dim);}
.status-conflict{background:var(--danger-dim);color:var(--danger);}
.status-generated{background:var(--court-dim);color:var(--court);}
.status-manual{background:#fdf1de;color:var(--gold);}

/* calendar grid */
.cal-wrap{overflow-x:auto;}
.cal{border-collapse:collapse;min-width:760px;}
.cal th{white-space:nowrap;}
.cal td{border:1px solid var(--line);padding:6px 8px;font-size:12.5px;vertical-align:top;min-width:120px;}
.cal .daycell{border-radius:6px;padding:6px 8px;}
.cal .sport{font-weight:600;}
.cal .fac{font-size:11px;color:var(--muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%, rgba(47,109,94,.10), transparent 45%),
  radial-gradient(circle at 85% 75%, rgba(199,106,62,.10), transparent 45%), var(--paper);}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:36px 34px;width:380px;}
.login-card .brand{margin-bottom:26px;color:var(--ink);}
.login-card .brand .name b{font-size:19px;}
.login-card .brand .name span{color:var(--muted);}
.login-tabs{display:flex;gap:0;margin-bottom:18px;border-bottom:1px solid var(--line);}
.login-tabs button{flex:1;padding:9px 0;background:none;border:none;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.5px;}
.login-tabs button.active{color:var(--court);border-bottom-color:var(--court);}
.login-card .field{margin-bottom:12px;}
#authMsg{font-size:12.5px;margin-top:10px;min-height:16px;}
#authMsg.err{color:var(--danger);}
#authMsg.ok{color:var(--court);}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:13px;}

.conflict-box{border:1px solid var(--danger);background:var(--danger-dim);border-radius:8px;padding:12px 14px;margin-bottom:14px;color:var(--danger);font-size:13px;}
.conflict-box b{display:block;margin-bottom:4px;}
.badge-count{background:var(--clay);color:#fff;border-radius:20px;font-size:10px;padding:1px 6px;margin-left:6px;font-family:"IBM Plex Mono",monospace;}
.select-multi{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line);font-size:12.5px;background:var(--paper);}
.chip.on{background:var(--court);border-color:var(--court);color:#fff;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;min-width:130px;}
.stat .n{font-size:26px;font-family:"IBM Plex Mono",monospace;color:var(--court);}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-family:"IBM Plex Mono",monospace;}
</style>
</head>
<body>

<div id="loading" class="loading-screen">loading pe programme planner…</div>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen" class="login-wrap" style="display:none;">
  <div class="login-card">
    <div class="brand">
      <div class="mark"></div>
      <div class="name"><b>PE Programme Planner</b><span>SCHOOL SIGN IN</span></div>
    </div>
    <div class="login-tabs">
      <button id="tabLogin" class="active" onclick="setAuthTab('login')">Log in</button>
      <button id="tabSignup" onclick="setAuthTab('signup')">Create account</button>
      <button id="tabReset" onclick="setAuthTab('reset')">Reset</button>
    </div>
    <form id="authForm" onsubmit="return handleAuthSubmit(event)">
      <div class="field"><label>Email</label><input type="email" id="authEmail" required></div>
      <div class="field" id="pwField"><label>Password</label><input type="password" id="authPassword" minlength="6"></div>
      <button class="btn" style="width:100%;margin-top:6px;" type="submit" id="authSubmitBtn">Log in</button>
    </form>
    <div id="authMsg"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="sidebar">
    <div class="brand">
      <div class="mark"></div>
      <div class="name"><b>PE Programme<br>Planner</b><span id="schoolNameTag">SCHOOL</span></div>
    </div>
    <div id="schoolSwitcher" style="margin-bottom:14px;"></div>
    <button class="navbtn active" data-page="dashboard" onclick="goPage('dashboard')"><span class="num">00</span>Dashboard</button>
    <button class="navbtn" data-page="classes" onclick="goPage('classes')"><span class="num">01</span>Classes &amp; timetable</button>
    <button class="navbtn" data-page="import" onclick="goPage('import')"><span class="num">01b</span>Import from Excel</button>
    <button class="navbtn" data-page="sports" onclick="goPage('sports')"><span class="num">02</span>Sports</button>
    <button class="navbtn" data-page="facilities" onclick="goPage('facilities')"><span class="num">03</span>Facilities</button>
    <button class="navbtn" data-page="periods" onclick="goPage('periods')"><span class="num">04</span>Periods &amp; dates</button>
    <button class="navbtn" data-page="programme-setup" onclick="goPage('programme-setup')"><span class="num">05</span>Programme setup</button>
    <button class="navbtn" data-page="generator" onclick="goPage('generator')"><span class="num">06</span>Generator</button>
    <button class="navbtn" data-page="calendar" onclick="goPage('calendar')"><span class="num">07</span>Calendar / grid</button>
    <button class="navbtn" data-page="export" onclick="goPage('export')"><span class="num">08</span>Export / print</button>
    <button class="navbtn" data-page="settings" onclick="goPage('settings')"><span class="num">09</span>Settings</button>
    <div class="sidebar-foot">
      <div id="userEmailTag" class="mono"></div>
      <button onclick="logout()">Log out</button>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
/* =========================================================
   CONFIG — your Supabase project
   ========================================================= */
const SUPABASE_URL = "https://mihsgxvwddjfmwxyfzia.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_M7zTAWdwjuk-FV9N2hbM_g_0VJOUUmY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const SITE_URL = "https://mrleo-pe.github.io/Programmation-planner/";

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

/* in-memory cache of the current school's data */
let STATE = {
  session: null,
  schools: [], currentSchoolId: null,
  school: null,
  yearGroups: [], classes: [], sessions: [],
  sports: [], facilities: [], sportFacilities: [],
  periods: [], unavailable: [], ygSports: [],
  entries: [], importBatches: []
};
let currentPage = 'dashboard';
let currentPeriodFilter = null;

/* ---------------------------------------------------------
   AUTH
   --------------------------------------------------------- */
let authTab = 'login';
function setAuthTab(tab){
  authTab = tab;
  ['tabLogin','tabSignup','tabReset'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(tab==='login'?'tabLogin':tab==='signup'?'tabSignup':'tabReset').classList.add('active');
  document.getElementById('authSubmitBtn').textContent = tab==='login'?'Log in':tab==='signup'?'Create account':'Send reset email';
  document.getElementById('pwField').style.display = tab==='reset' ? 'none' : 'flex';
  document.getElementById('authMsg').textContent='';
}

async function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const msg = document.getElementById('authMsg');
  msg.className=''; msg.textContent='working…';
  try{
    if(authTab==='login'){
      const {error} = await sb.auth.signInWithPassword({email, password});
      if(error) throw error;
      const {data:{session}} = await sb.auth.getSession();
      STATE.session = session;
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('userEmailTag').textContent = session.user.email;
      document.getElementById('app').classList.add('ready');
      await loadSchools();
      if(STATE.schools.length===0){
        renderNoSchools();
      } else {
        pickCurrentSchool();
        await loadAll();
        goPage('dashboard');
      }
      booted = true;
      return false;
    } else if(authTab==='signup'){
      const {error} = await sb.auth.signUp({email, password, options:{emailRedirectTo: SITE_URL}});
      if(error) throw error;
      msg.className='ok';
      msg.textContent='Account created. Check your inbox to confirm, then log in.';
      return;
    } else {
      const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: SITE_URL});
      if(error) throw error;
      msg.className='ok';
      msg.textContent='Password reset email sent.';
      return;
    }
    msg.textContent='';
  }catch(err){
    msg.className='err';
    msg.textContent = err.message || 'Something went wrong.';
  }
  return false;
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

/* ---------------------------------------------------------
   BOOT
   --------------------------------------------------------- */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  STATE.session = session;
  document.getElementById('loading').style.display='none';
  if(!session){
    document.getElementById('loginScreen').style.display='flex';
    booted = true;
    return;
  }
  document.getElementById('userEmailTag').textContent = session.user.email;
  await loadSchools();
  if(STATE.schools.length===0){
    document.getElementById('app').classList.add('ready');
    renderNoSchools();
    booted = true;
    return;
  }
  pickCurrentSchool();
  await loadAll();
  document.getElementById('app').classList.add('ready');
  goPage('dashboard');
  booted = true;
}

function renderNoSchools(){
  document.getElementById('main').innerHTML='';
  document.getElementById('schoolNameTag').textContent='NO SCHOOL YET';
  const box = document.getElementById('schoolSwitcher');
  if(box) box.innerHTML='';
  const m = document.getElementById('main');
  m.appendChild(el(head('Welcome','Create your first school', 'Your account can hold several schools later — start with one.')));
  const panel = el(`<div class="panel"><h3>New school</h3>
    <div class="field" style="max-width:320px;"><label>School name</label><input type="text" id="firstSchoolName" placeholder="e.g. Greenfield International School"></div>
    <button class="btn" style="margin-top:12px;" onclick="createFirstSchool()">Create school</button></div>`);
  m.appendChild(panel);
}
async function createFirstSchool(){
  const name = document.getElementById('firstSchoolName').value.trim();
  const s = await createSchool(name);
  if(s){ goPage('dashboard'); }
}

let booted = false;
sb.auth.onAuthStateChange((event, session)=>{
  if(!booted) return; // ignore events fired during initial getSession()
  if(event==='SIGNED_IN' && (!STATE.session || STATE.session.user.id!==session.user.id)){
    location.reload();
  }
  if(event==='SIGNED_OUT'){ location.reload(); }
});

/* A user account can own several schools. STATE.schools holds the
   list; STATE.currentSchoolId (persisted in localStorage) picks which
   one's data is loaded into the rest of STATE. */
async function loadSchools(){
  const {data, error} = await sb.from('schools').select('*').order('created_at');
  if(error){
    console.error('loadSchools failed:', error);
    alert('Could not load your schools from Supabase:\n' + error.message + '\n\nThis usually means the database schema needs the fix_schools.sql patch applied.');
    STATE.schools = [];
    return STATE.schools;
  }
  STATE.schools = data || [];
  return STATE.schools;
}

function pickCurrentSchool(){
  const stored = localStorage.getItem('pe_current_school');
  if(stored && STATE.schools.some(s=>s.id===stored)){ STATE.currentSchoolId = stored; return; }
  STATE.currentSchoolId = STATE.schools[0] ? STATE.schools[0].id : null;
  if(STATE.currentSchoolId) localStorage.setItem('pe_current_school', STATE.currentSchoolId);
}

async function switchSchool(id){
  STATE.currentSchoolId = id;
  localStorage.setItem('pe_current_school', id);
  await loadAll();
  goPage('dashboard');
}

async function createSchool(name){
  const {data, error} = await sb.from('schools').insert({owner_id: STATE.session.user.id, name: name||''}).select().single();
  if(error){
    console.error('createSchool failed:', error);
    alert('Could not create the school:\n' + error.message + '\n\nThis usually means the database schema needs the fix_schools.sql patch applied.');
    return null;
  }
  await loadSchools();
  STATE.currentSchoolId = data.id;
  localStorage.setItem('pe_current_school', data.id);
  await loadAll();
  return data;
}

async function deleteSchool(id){
  const s = byId(STATE.schools, id);
  if(!confirm(`Delete "${s?.name||'this school'}" and ALL of its data? This cannot be undone.`)) return;
  await sb.from('schools').delete().eq('id', id);
  await loadSchools();
  if(STATE.currentSchoolId === id){
    STATE.currentSchoolId = STATE.schools[0] ? STATE.schools[0].id : null;
    if(STATE.currentSchoolId) localStorage.setItem('pe_current_school', STATE.currentSchoolId);
    else localStorage.removeItem('pe_current_school');
  }
  await loadAll();
  render();
}

async function loadAll(){
  const sid = STATE.currentSchoolId;
  STATE.school = STATE.schools.find(s=>s.id===sid) || {id:sid, name:''};
  if(!sid){
    STATE.yearGroups=[]; STATE.classes=[]; STATE.sessions=[]; STATE.sports=[]; STATE.facilities=[];
    STATE.sportFacilities=[]; STATE.periods=[]; STATE.unavailable=[]; STATE.ygSports=[]; STATE.entries=[]; STATE.importBatches=[];
    renderSchoolSwitcher();
    return;
  }
  const [yg, cls, sess, sports, fac, sf, per, unav, ygs, entries, batches] = await Promise.all([
    sb.from('year_groups').select('*').eq('school_id', sid),
    sb.from('classes').select('*').eq('school_id', sid),
    sb.from('pe_sessions').select('*').eq('school_id', sid),
    sb.from('sports').select('*').eq('school_id', sid),
    sb.from('facilities').select('*').eq('school_id', sid),
    sb.from('sport_facilities').select('*').eq('school_id', sid),
    sb.from('periods').select('*').eq('school_id', sid),
    sb.from('unavailable_dates').select('*').eq('school_id', sid).order('date'),
    sb.from('year_group_sports').select('*').eq('school_id', sid),
    sb.from('programme_entries').select('*').eq('school_id', sid).order('date'),
    sb.from('import_batches').select('*').eq('school_id', sid).order('created_at', {ascending:false}),
  ]);
  const results = {year_groups:yg, classes:cls, pe_sessions:sess, sports:sports, facilities:fac, sport_facilities:sf, periods:per, unavailable_dates:unav, year_group_sports:ygs, programme_entries:entries, import_batches:batches};
  const failed = Object.entries(results).filter(([k,v])=>v.error);
  if(failed.length){
    console.error('loadAll: some queries failed', failed);
    alert('Could not load some data from Supabase:\n' + failed.map(([k,v])=>`${k}: ${v.error.message}`).join('\n') + '\n\nShowing whatever loaded successfully; anything that failed keeps its previous value instead of being cleared.');
  }
  // Only overwrite state for queries that actually succeeded — a failed
  // query must never silently wipe out data that was already loaded.
  if(!yg.error) STATE.yearGroups = naturalSortBy(yg.data||[], 'name');
  if(!cls.error) STATE.classes = naturalSortBy(cls.data||[], 'name');
  if(!sess.error) STATE.sessions = sess.data || [];
  if(!sports.error) STATE.sports = naturalSortBy(sports.data||[], 'name');
  if(!fac.error) STATE.facilities = naturalSortBy(fac.data||[], 'name');
  if(!sf.error) STATE.sportFacilities = sf.data || [];
  if(!per.error) STATE.periods = naturalSortBy(per.data||[], 'start_date');
  if(!unav.error) STATE.unavailable = unav.data || [];
  if(!ygs.error) STATE.ygSports = ygs.data || [];
  if(!entries.error) STATE.entries = entries.data || [];
  if(!batches.error) STATE.importBatches = batches.data || [];
  renderSchoolSwitcher();
}

function renderSchoolSwitcher(){
  const tag = document.getElementById('schoolNameTag');
  if(tag) tag.textContent = STATE.school.name ? STATE.school.name.toUpperCase() : 'UNNAMED SCHOOL';
  const box = document.getElementById('schoolSwitcher');
  if(!box) return;
  box.innerHTML = '';
  const select = el(`<select id="schoolSwitchSelect" class="mono" style="width:100%;margin-bottom:6px;"></select>`);
  STATE.schools.forEach(s=>{
    select.appendChild(el(`<option value="${s.id}" ${s.id===STATE.currentSchoolId?'selected':''}>${esc(s.name)||'Unnamed school'}</option>`));
  });
  select.addEventListener('change', e=>switchSchool(e.target.value));
  box.appendChild(select);
  box.appendChild(el(`<button class="navbtn" style="font-size:12px;padding:6px 10px;" onclick="promptNewSchool()">+ New school</button>`));
}

function goPage(page){
  if(!STATE.currentSchoolId && page!=='settings'){
    renderNoSchools();
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
    return;
  }
  currentPage = page;
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.page===page));
  render();
}

function render(){
  const map = {
    dashboard: renderDashboard,
    classes: renderClasses,
    import: renderImport,
    sports: renderSports,
    facilities: renderFacilities,
    periods: renderPeriods,
    'programme-setup': renderProgrammeSetup,
    generator: renderGenerator,
    calendar: renderCalendar,
    export: renderExport,
    settings: renderSettings,
  };
  const main = document.getElementById('main');
  main.innerHTML = '';
  try{
    (map[currentPage] || renderDashboard)();
  }catch(err){
    console.error('render() failed on page', currentPage, err);
    main.innerHTML = '';
    main.appendChild(el(`<div class="conflict-box"><b>This page hit an error while rendering</b>
      Page: ${esc(currentPage)}<br>Error: ${esc(err.message)}<br><br>
      Your data is safe in the database — this is just a display bug. Please share this exact message.</div>`));
  }
}

function head(eyebrow,title,sub){
  return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div></div>`;
}
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild || t.content.firstChild; }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function byId(arr,id){ return arr.find(x=>x.id===id); }

/* Natural sort so "Year 10" comes after "Year 9", not before "Year 7". */
const naturalCollator = new Intl.Collator(undefined, {numeric:true, sensitivity:'base'});
function naturalSortBy(arr, key){
  return [...arr].sort((a,b)=>naturalCollator.compare(a[key]||'', b[key]||''));
}

/* Every write goes through this so failures are never silent again. */
async function dbWrite(promise, label){
  const {error} = await promise;
  if(error){
    console.error(label+' failed:', error);
    alert(`Could not save (${label}):\n${error.message}`);
    return false;
  }
  return true;
}

function cssSafe(s){ return s.replace(/[^a-zA-Z0-9]/g,'_'); }

function guessYearGroupId(className){
  const m = className.match(/^Y?\s*(\d{1,2})/i);
  if(!m) return null;
  const num = m[1];
  const match = STATE.yearGroups.find(yg=>yg.name.replace(/[^0-9]/g,'')===num);
  return match ? match.id : null;
}

function toggleImportOption(key, value){
  IMPORT.options[key] = value;
  if(IMPORT.workbook){ parseCurrentSheet(); render(); }
}

async function switchImportSheet(name){
  IMPORT.sheetName = name;
  parseCurrentSheet();
  render();
}

function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellText:true});
      IMPORT.workbook = wb;
      IMPORT.sheetName = wb.SheetNames[0];
      parseCurrentSheet();
    }catch(err){
      IMPORT.parseInfo = {error: err.message};
      IMPORT.rows = [];
    }
    render();
  };
  reader.readAsArrayBuffer(file);
}

function parseCurrentSheet(){
  try{
    const sheet = IMPORT.workbook.Sheets[IMPORT.sheetName];
    const result = parseTimetableSheet(sheet, IMPORT.options);
    IMPORT.rows = result.rows;
    IMPORT.uniqueClasses = [...new Set(result.rows.map(r=>r.className))].sort();
    IMPORT.parseInfo = result;
  }catch(err){
    console.error('parseCurrentSheet failed:', err);
    IMPORT.rows = [];
    IMPORT.uniqueClasses = [];
    IMPORT.parseInfo = {error: err.message};
  }
}

const DAY_NAMES = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY'];

function parseTimetableSheet(sheet, options){
  options = options || {primarySplit:true, secondarySplit:true};
  if(!sheet['!ref']) throw new Error('This sheet appears to be empty.');
  const range = XLSX.utils.decode_range(sheet['!ref']);
  const merges = sheet['!merges'] || [];

  function cellAt(r,c){
    const addr = XLSX.utils.encode_cell({r,c});
    const cell = sheet[addr];
    if(!cell) return '';
    return (cell.w!==undefined ? cell.w : (cell.v!==undefined ? String(cell.v) : '')).toString();
  }
  function mergeAt(r,c){
    return merges.find(m=>r>=m.s.r && r<=m.e.r && c>=m.s.c && c<=m.e.c) || null;
  }
  function isMergeTopLeft(m,r,c){ return m.s.r===r && m.s.c===c; }

  // 1. find the header row containing day names
  let headerRow = -1;
  const dayCols = {};
  for(let r=range.s.r; r<=range.e.r; r++){
    const found = {};
    for(let c=range.s.c; c<=range.e.c; c++){
      const txt = cellAt(r,c).trim().toUpperCase();
      const dayIdx = DAY_NAMES.indexOf(txt);
      if(dayIdx>=0) found[dayIdx]=c;
    }
    if(Object.keys(found).length>=3){ headerRow=r; Object.assign(dayCols, found); break; }
  }
  if(headerRow===-1){
    return {rows:[], error:'Could not find a header row containing day names (MONDAY, TUESDAY, ...). Make sure the sheet has weekday names as column headers.'};
  }

  // day column span (usually 2 columns per day via merge)
  const daySpan = {};
  Object.entries(dayCols).forEach(([dayIdx,col])=>{
    const m = mergeAt(headerRow, col);
    daySpan[dayIdx] = m ? (m.e.c - m.s.c + 1) : 1;
  });

  // 2. period/time columns: assume immediately left of the first day column
  const firstDayCol = Math.min(...Object.values(dayCols));
  const periodCol = Math.max(range.s.c, firstDayCol-2);
  const timeCol = Math.max(range.s.c, firstDayCol-1);

  const rows = [];
  let currentTimeText = '';
  for(let r=headerRow+1; r<=range.e.r; r++){
    const timeTxt = cellAt(r,timeCol).trim();
    if(timeTxt) currentTimeText = timeTxt;
    const timeMatch = currentTimeText.match(/(\d{1,2})[:.h](\d{2})\s*[-–to]+\s*(\d{1,2})[:.h](\d{2})/i);
    if(!timeMatch) continue; // no valid time range yet (e.g. above header, or break/lunch row with odd format)
    const start = timeMatch[1].padStart(2,'0')+':'+timeMatch[2];
    const end = timeMatch[3].padStart(2,'0')+':'+timeMatch[4];

    Object.entries(dayCols).forEach(([dayIdxStr,col])=>{
      const dayIdx = parseInt(dayIdxStr,10);
      const span = daySpan[dayIdx];
      if(span>=2){
        const m = mergeAt(r, col);
        if(m && isMergeTopLeft(m,r,col) && (m.e.c-m.s.c+1)>=2){
          pushEntry(col);
          return;
        }
      }
      // otherwise treat each column in the day's span separately
      for(let cc=col; cc<col+span; cc++){
        const cm = mergeAt(r,cc);
        if(cm && !isMergeTopLeft(cm,r,cc)) continue; // continuation of a merge, skip
        pushEntryAt(cc);
      }
      function pushEntryAt(cc){
        const txt = cellAt(r,cc);
        if(!txt.trim()) return;
        addRow(txt, dayIdx);
      }
      function pushEntry(cc){
        const txt = cellAt(r,cc);
        if(!txt.trim()) return;
        addRow(txt, dayIdx);
      }
      function addRow(txt, dayIdx){
        const lines = txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
        if(!lines.length) return;
        const className = lines[0];
        const teacherRaw = lines.slice(1).join('/');
        const teacherList = teacherRaw.split(/[\/,+&]/).map(t=>t.trim()).filter(Boolean);
        if(teacherList.length<=1){
          rows.push({day: dayIdx, start, end, className, teacher: teacherList[0]||''});
          return;
        }
        // Primary (Year 1–6): a code like "5CHJ" is a year number followed
        // by one letter per class. When the letter count matches the
        // teacher count, pair them in order: 1st letter <-> 1st teacher.
        if(options.primarySplit){
          const codeMatch = className.match(/^(\d{1,2})\s*([A-Za-z]+)$/);
          if(codeMatch){
            const yearNum = parseInt(codeMatch[1],10);
            const letters = codeMatch[2].split('');
            if(yearNum>=1 && yearNum<=6 && letters.length===teacherList.length){
              teacherList.forEach((teacher,i)=>{
                rows.push({day: dayIdx, start, end, className: yearNum+letters[i], teacher});
              });
              return;
            }
          }
        }
        // Secondary (Year 7–11): gender-split groups sharing the same time slot.
        if(options.secondarySplit){
          const boysCount = Math.ceil(teacherList.length/2);
          const girlsCount = teacherList.length - boysCount;
          teacherList.forEach((teacher,i)=>{
            let groupName;
            if(i<boysCount){
              groupName = className + (boysCount>1 ? ` boys${i+1}` : ' boys');
            } else {
              const gi = i-boysCount+1;
              groupName = className + (girlsCount>1 ? ` girls${gi}` : ' girls');
            }
            rows.push({day: dayIdx, start, end, className: groupName, teacher});
          });
          return;
        }
        // Neither rule applies / both off: keep as one combined class with all teachers listed.
        rows.push({day: dayIdx, start, end, className, teacher: teacherList.join(', ')});
      }
    });
  }

  return {rows, headerRow, periodCol, timeCol, dayCols};
}

async function undoImportBatch(batchId){
  const batch = STATE.importBatches.find(b=>b.id===batchId);
  if(!batch){ alert('Could not find that import batch.'); return; }
  if(!confirm(`Undo this import? This removes:\n- ${batch.session_count} session(s) it created\n- any class or year group it created, but ONLY if nothing else has used them since\n\nClasses/year groups that already existed before this import, or that you've added other sessions to since, are left untouched.`)) return;

  // 1. delete this import's sessions first
  if(!await dbWrite(sb.from('pe_sessions').delete().eq('import_batch_id', batchId), 'undo import (sessions)')) return;

  // 2. delete classes this import created, but only if no OTHER session
  //    (outside this batch) still references them
  const classIds = batch.created_class_ids || [];
  let classesKept = 0, classesDeleted = 0;
  for(const classId of classIds){
    const stillUsed = STATE.sessions.some(s=>s.class_id===classId && s.import_batch_id!==batchId);
    if(stillUsed){ classesKept++; continue; }
    const {error} = await sb.from('classes').delete().eq('id', classId);
    if(error){ console.error('Could not delete class', classId, error); classesKept++; continue; }
    classesDeleted++;
  }

  // 3. delete year groups this import created, but only if no class still
  //    references them (whether from this import or added since)
  const ygIds = batch.created_year_group_ids || [];
  let ygsKept = 0, ygsDeleted = 0;
  for(const ygId of ygIds){
    const {data: refs} = await sb.from('classes').select('id').eq('year_group_id', ygId).limit(1);
    if(refs && refs.length){ ygsKept++; continue; }
    const {error} = await sb.from('year_groups').delete().eq('id', ygId);
    if(error){ console.error('Could not delete year group', ygId, error); ygsKept++; continue; }
    ygsDeleted++;
  }

  if(!await dbWrite(sb.from('import_batches').delete().eq('id', batchId), 'undo import (batch record)')) return;

  await loadAll();
  render();
  if(classesKept>0 || ygsKept>0){
    alert(`Undo complete, with some things kept because they're now used elsewhere:\n${classesDeleted} class(es) removed, ${classesKept} kept.\n${ygsDeleted} year group(s) removed, ${ygsKept} kept.`);
  }
}

async function commitImport(){
  const ygSelections = {};
  IMPORT.uniqueClasses.forEach(cname=>{
    ygSelections[cname] = document.getElementById('ygmap_'+cssSafe(cname)).value;
  });

  const newYearGroupIds = [];
  const newClassIds = [];

  // 1. create any needed year groups
  const yearGroupIdFor = {};
  for(const cname of IMPORT.uniqueClasses){
    const sel = ygSelections[cname];
    if(sel && sel!=='__new__'){
      yearGroupIdFor[cname] = sel;
    } else {
      const m = cname.match(/^Y?\s*(\d{1,2})/i);
      const label = m ? ('Year '+m[1]) : cname;
      let existing = STATE.yearGroups.find(yg=>yg.name.toLowerCase()===label.toLowerCase());
      if(!existing){
        const {data, error} = await sb.from('year_groups').insert({school_id: STATE.currentSchoolId, name: label}).select().single();
        if(error){ alert('Could not create year group "'+label+'": '+error.message); return; }
        STATE.yearGroups.push(data);
        existing = data;
        newYearGroupIds.push(data.id);
      }
      yearGroupIdFor[cname] = existing.id;
    }
  }

  // 2. create any needed classes
  const classIdFor = {};
  for(const cname of IMPORT.uniqueClasses){
    let existing = STATE.classes.find(c=>c.name.toLowerCase()===cname.toLowerCase());
    if(!existing){
      const {data, error} = await sb.from('classes').insert({school_id: STATE.currentSchoolId, name: cname, year_group_id: yearGroupIdFor[cname]||null}).select().single();
      if(error){ alert('Could not create class "'+cname+'": '+error.message); return; }
      STATE.classes.push(data);
      existing = data;
      newClassIds.push(data.id);
    }
    classIdFor[cname] = existing.id;
  }

  // 3. build session inserts, reading any edits made in the review table, skipping unchecked / exact duplicates
  const toInsert = [];
  let skippedDup = 0, skippedUnchecked = 0;
  IMPORT.rows.forEach((r,i)=>{
    const incl = document.getElementById('incl_'+i).checked;
    if(!incl){ skippedUnchecked++; return; }
    const start = document.getElementById('start_'+i).value;
    const end = document.getElementById('end_'+i).value;
    const className = document.getElementById('cls_'+i).value.trim();
    const teacher = document.getElementById('tch_'+i).value.trim() || null;
    const classId = classIdFor[className] || (STATE.classes.find(c=>c.name.toLowerCase()===className.toLowerCase())||{}).id;
    if(!classId){ return; }
    const dup = STATE.sessions.some(s=>s.class_id===classId && s.day_of_week===r.day && s.start_time.slice(0,5)===start && s.end_time.slice(0,5)===end);
    if(dup){ skippedDup++; return; }
    toInsert.push({school_id: STATE.currentSchoolId, class_id: classId, day_of_week: r.day, start_time:start, end_time:end, teacher});
  });

  if(toInsert.length || newClassIds.length || newYearGroupIds.length){
    const {data: batch, error: batchErr} = await sb.from('import_batches').insert({
      school_id: STATE.currentSchoolId,
      label: (IMPORT.sheetName||'Import')+' — '+new Date().toLocaleString(),
      session_count: toInsert.length,
      created_class_ids: newClassIds,
      created_year_group_ids: newYearGroupIds,
    }).select().single();
    if(batchErr){ alert('Could not record import batch (sessions not saved): '+batchErr.message); return; }
    if(toInsert.length){
      const tagged = toInsert.map(s=>({...s, import_batch_id: batch.id}));
      if(!await dbWrite(sb.from('pe_sessions').insert(tagged), 'import sessions')) return;
    }
  }

  alert(`Import complete.\n${toInsert.length} sessions created.\n${newClassIds.length} new classes created.\n${newYearGroupIds.length} new year groups created.\n${skippedDup} sessions skipped (already existed).\n${skippedUnchecked} sessions skipped (unchecked).`);

  await loadAll();

}

function renderWeeklyTimetableGrid(){
  if(STATE.sessions.length===0){
    return el(`<div class="panel"><h3>Weekly timetable overview</h3><div class="empty">No sessions yet — add classes and sessions below, or import from Excel (page 01b).</div></div>`);
  }
  // group sessions by a common start-end time slot, across all classes/days
  const slotKey = s => s.start_time.slice(0,5)+'–'+s.end_time.slice(0,5);
  const slots = [...new Set(STATE.sessions.map(slotKey))].sort();

  const panel = el(`<div class="panel"><h3>Weekly timetable overview</h3>
    <div class="cal-wrap"><table class="cal"><thead><tr><th>Time</th>${DAYS.slice(0,5).map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody id="weeklyGridBody"></tbody></table></div>
    <p class="hint">Read-only overview built from every class's weekly sessions below. Edit sessions in the table underneath, or re-import to update.</p>
  </div>`);
  const tbody = panel.querySelector('#weeklyGridBody');
  slots.forEach(slot=>{
    const cells = [0,1,2,3,4].map(dayIdx=>{
      const matches = STATE.sessions.filter(s=>slotKey(s)===slot && s.day_of_week===dayIdx);
      if(matches.length===0) return `<td></td>`;
      const inner = matches.map(s=>{
        const c = byId(STATE.classes, s.class_id);
        return `<div class="sport">${c?esc(c.name):'?'}</div>${s.teacher?`<div class="fac">${esc(s.teacher)}</div>`:''}`;
      }).join('<hr style="border:none;border-top:1px dashed var(--line);margin:4px 0;">');
      return `<td>${inner}</td>`;
    }).join('');
    tbody.appendChild(el(`<tr><td class="mono"><b>${slot}</b></td>${cells}</tr>`));
  });
  return panel;
}

function dateRange(start,end){
  const out=[]; let d=new Date(start+'T00:00:00'); const e=new Date(end+'T00:00:00');
  while(d<=e){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return out;
}

async function runGenerator(){
  const periodId = document.getElementById('genPeriod').value;
  if(!periodId){ alert('Choose a period first.'); return; }
  const period = byId(STATE.periods, periodId);
  const allDates = dateRange(period.start_date, period.end_date);
  const unavailableDates = new Set(
    STATE.unavailable.filter(u=>!u.period_id || u.period_id===periodId).map(u=>u.date)
  );

  // manual entries in this window are preserved and treated as occupying their facility.
  const keepManual = STATE.entries.filter(e=>e.period_id===periodId && e.status==='manual');
  const toDelete = STATE.entries.filter(e=>e.period_id===periodId && e.status!=='manual');
  if(toDelete.length){
    if(!await dbWrite(sb.from('programme_entries').delete().in('id', toDelete.map(e=>e.id)), 'clear old entries')) return;
  }

  // facility occupancy map: `${date}|${startTime}` -> Set(facility_id)
  const occupancy = {};
  function occKey(date, start, end){ return `${date}`; }
  function markOccupied(date, start, end, facilityId){
    const key = date;
    occupancy[key] = occupancy[key] || [];
    occupancy[key].push({start, end, facilityId});
  }
  function isFree(date, start, end, facilityId){
    const list = occupancy[date] || [];
    return !list.some(o => o.facilityId===facilityId && overlaps(o.start,o.end,start,end));
  }
  function overlaps(s1,e1,s2,e2){ return s1 < e2 && s2 < e1; }

  keepManual.forEach(e=>{
    const sess = STATE.sessions.find(s=>s.id===e.session_id);
    if(sess && e.facility_id) markOccupied(e.date, sess.start_time, sess.end_time, e.facility_id);
  });

  // round-robin sport index per year group to balance sports
  const ygSportIndex = {};
  function nextSport(ygId){
    const options = STATE.ygSports.filter(l=>l.year_group_id===ygId).map(l=>l.sport_id);
    if(options.length===0) return null;
    const i = ygSportIndex[ygId] || 0;
    const sportId = options[i % options.length];
    ygSportIndex[ygId] = i+1;
    return sportId;
  }

  const newEntries = [];
  const classes = STATE.classes;
  for(const date of allDates){
    if(unavailableDates.has(date)) continue;
    const dow = new Date(date+'T00:00:00').getDay(); // 0=Sun
    const dowIdx = dow===0 ? 6 : dow-1; // convert to 0=Mon
    for(const cls of classes){
      const sessionsForDay = STATE.sessions.filter(s=>s.class_id===cls.id && s.day_of_week===dowIdx);
      for(const sess of sessionsForDay){
        // skip if manual entry already covers this class/session/date
        if(keepManual.some(e=>e.class_id===cls.id && e.session_id===sess.id && e.date===date)) continue;
        const ygId = cls.year_group_id;
        if(!ygId){ continue; }
        const sportId = nextSport(ygId);
        if(!sportId){ continue; }
        const facOptions = STATE.sportFacilities.filter(l=>l.sport_id===sportId).map(l=>l.facility_id);
        let chosenFacility = null;
        for(const facId of facOptions){
          if(isFree(date, sess.start_time, sess.end_time, facId)){ chosenFacility = facId; break; }
        }
        const status = chosenFacility ? 'generated' : 'conflict';
        if(chosenFacility) markOccupied(date, sess.start_time, sess.end_time, chosenFacility);
        newEntries.push({
          school_id: STATE.currentSchoolId,
          class_id: cls.id, session_id: sess.id, period_id: periodId, date,
          sport_id: sportId, facility_id: chosenFacility, status
        });
      }
    }
  }

  if(newEntries.length){
    // insert in batches of 500
    for(let i=0;i<newEntries.length;i+=500){
      if(!await dbWrite(sb.from('programme_entries').insert(newEntries.slice(i,i+500)), 'save generated entries')) return;
    }
  }
  await loadAll();
  goPage('calendar');
}

async function clearGenerated(){
  const gen = STATE.entries.filter(e=>e.status==='generated' || e.status==='conflict');
  if(gen.length===0) return;
  if(!confirm(`Remove ${gen.length} generated/conflict entries? Manual changes are kept.`)) return;
  if(!await dbWrite(sb.from('programme_entries').delete().in('id', gen.map(e=>e.id)), 'clear generated entries')) return;
  await loadAll(); render();
}

/* ---------------------------------------------------------
   CALENDAR / GRID
   --------------------------------------------------------- */
function renderCalendar(){
  const m = document.getElementById('main');
  m.appendChild(el(head('07 · View','Calendar / grid','Every generated and manual allocation, grouped by week — same layout as your weekly timetable, with the facility added to each session. Click a session to edit it.')));

  const perOptions = `<option value="">All periods</option>` + STATE.periods.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const clsOptions = `<option value="">All classes</option>` + STATE.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const toolbar = el(`<div class="toolbar">
    <select id="calPeriod">${perOptions}</select>
    <select id="calClass">${clsOptions}</select>
    <button class="btn secondary small" onclick="applyCalFilter()">Filter</button>
  </div>`);
  m.appendChild(toolbar);

  const legend = el(`<div class="legend">
    <span><i style="background:var(--court-dim)"></i>Generated</span>
    <span><i style="background:#fdf1de"></i>Manually modified</span>
    <span><i style="background:var(--danger-dim)"></i>Conflict</span>
  </div>`);
  m.appendChild(legend);

  const periodSel = document.getElementById('calPeriod');
  const classSel = document.getElementById('calClass');
  periodSel.value = STATE._calPeriodFilter || '';
  classSel.value = STATE._calClassFilter || '';

  window.applyCalFilter = function(){
    STATE._calPeriodFilter = document.getElementById('calPeriod').value;
    STATE._calClassFilter = document.getElementById('calClass').value;
    render();
  };

  let entries = [...STATE.entries];
  if(STATE._calPeriodFilter) entries = entries.filter(e=>e.period_id===STATE._calPeriodFilter);
  if(STATE._calClassFilter) entries = entries.filter(e=>e.class_id===STATE._calClassFilter);

  if(entries.length===0){
    m.appendChild(el(`<div class="empty">No entries yet. Run the generator (page 06) or check your filters.</div>`));
    return;
  }

  // group by ISO week (Monday of that week), then render one small
  // timetable-style grid per week: time slots down the side, days across.
  function mondayOf(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const dow = d.getDay(); // 0=Sun
    const diff = dow===0 ? -6 : 1-dow;
    d.setDate(d.getDate()+diff);
    return d.toISOString().slice(0,10);
  }
  const withSession = [];
  const noSession = [];
  entries.forEach(e=>{
    const sess = STATE.sessions.find(s=>s.id===e.session_id);
    if(sess) withSession.push({...e, _slot: sess.start_time.slice(0,5)+'–'+sess.end_time.slice(0,5)});
    else noSession.push(e);
  });

  const weeks = {};
  withSession.forEach(e=>{
    const wk = mondayOf(e.date);
    (weeks[wk] = weeks[wk] || []).push(e);
  });
  const weekKeys = Object.keys(weeks).sort();

  weekKeys.forEach(wk=>{
    const weekEntries = weeks[wk];
    const slots = [...new Set(weekEntries.map(e=>e._slot))].sort();
    const wkPanel = el(`<div class="panel"><h3>Week of ${wk}</h3>
      <div class="cal-wrap"><table class="cal"><thead><tr><th>Time</th>${DAYS.slice(0,5).map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody></tbody></table></div>
    </div>`);
    const tbody = wkPanel.querySelector('tbody');
    slots.forEach(slot=>{
      const cells = [0,1,2,3,4].map(dayIdx=>{
        const matches = weekEntries.filter(e=>{
          const dow = new Date(e.date+'T00:00:00').getDay();
          const idx = dow===0?6:dow-1;
          return idx===dayIdx && e._slot===slot;
        });
        if(matches.length===0) return `<td></td>`;
        const inner = matches.map(e=>{
          const cls = byId(STATE.classes, e.class_id);
          const sp = byId(STATE.sports, e.sport_id);
          const fac = byId(STATE.facilities, e.facility_id);
          return `<div class="status-${e.status}" style="border-radius:6px;padding:4px 6px;margin-bottom:4px;cursor:pointer;" onclick="editEntry('${e.id}')">
            <div class="sport">${cls?esc(cls.name):'?'}</div>
            <div class="fac">${sp?esc(sp.name):'unassigned'}${fac?' · '+esc(fac.name):''}</div>
          </div>`;
        }).join('');
        return `<td>${inner}</td>`;
      }).join('');
      tbody.appendChild(el(`<tr><td class="mono"><b>${slot}</b></td>${cells}</tr>`));
    });
    m.appendChild(wkPanel);
  });

  if(noSession.length){
    const tbl = el(`<div class="panel"><h3>Other entries (no linked weekly session)</h3>
      <table><thead><tr><th>Date</th><th>Class</th><th>Sport</th><th>Facility</th><th>Status</th><th></th></tr></thead><tbody></tbody></table></div>`);
    const tbody = tbl.querySelector('tbody');
    noSession.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
      const cls = byId(STATE.classes, e.class_id);
      const sp = byId(STATE.sports, e.sport_id);
      const fac = byId(STATE.facilities, e.facility_id);
      tbody.appendChild(el(`<tr class="status-${e.status}">
        <td class="mono">${e.date}</td><td>${cls?esc(cls.name):'?'}</td>
        <td>${sp?esc(sp.name):'<span class="hint">unassigned</span>'}</td>
        <td>${fac?esc(fac.name):'<span class="hint">none</span>'}</td>
        <td><span class="tag ${e.status==='conflict'?'clay':'green'}">${e.status}</span></td>
        <td><button class="btn small secondary" onclick="editEntry('${e.id}')">Edit</button></td>
      </tr>`));
    });
    m.appendChild(tbl);
  }
}

async function editEntry(id){
  const e = byId(STATE.entries, id);
  const sportOptions = STATE.sports.map(s=>`<option value="${s.id}" ${s.id===e.sport_id?'selected':''}>${esc(s.name)}</option>`).join('');
  const facOptions = STATE.facilities.map(f=>`<option value="${f.id}" ${f.id===e.facility_id?'selected':''}>${esc(f.name)}</option>`).join('');
  const sport = prompt('Sport id list — choose by typing exact name, or leave blank to keep:\n' + STATE.sports.map(s=>s.name).join(', '), byId(STATE.sports,e.sport_id)?.name||'');
  if(sport===null) return;
  const fac = prompt('Facility — choose by typing exact name, or leave blank for none:\n' + STATE.facilities.map(f=>f.name).join(', '), byId(STATE.facilities,e.facility_id)?.name||'');
  if(fac===null) return;
  const sportObj = STATE.sports.find(s=>s.name.toLowerCase()===sport.trim().toLowerCase());
  const facObj = STATE.facilities.find(f=>f.name.toLowerCase()===fac.trim().toLowerCase());

  // conflict check: is facility free at this date/session for another class?
  let status = 'manual';
  if(facObj){
    const sess = byId(STATE.sessions, e.session_id);
    const clash = STATE.entries.some(other => other.id!==e.id && other.date===e.date && other.facility_id===facObj.id && (()=>{
      const os = byId(STATE.sessions, other.session_id);
      if(!sess || !os) return false;
      return sess.start_time < os.end_time && os.start_time < sess.end_time;
    })());
    if(clash) status='conflict';
  } else {
    status='conflict';
  }
  await dbWrite(sb.from('programme_entries').update({sport_id: sportObj?sportObj.id:null, facility_id: facObj?facObj.id:null, status}).eq('id', id), 'update entry');
  await loadAll(); render();
}

/* ---------------------------------------------------------
   EXPORT / PRINT
   --------------------------------------------------------- */
function renderExport(){
  const m = document.getElementById('main');
  m.appendChild(el(head('08 · Output','Export / print','Print the current calendar view, or export it as CSV.')));
  const panel = el(`<div class="panel"><h3>Export options</h3>
    <div class="row">
      <button class="btn" onclick="window.print()">Print current programme</button>
      <button class="btn secondary" onclick="exportCSV()">Download CSV</button>
    </div>
    <p class="hint">Print uses your browser's print dialog — set layout to landscape for wide programmes. CSV includes date, class, sport, facility, status.</p>
  </div>`);
  m.appendChild(panel);
}
function exportCSV(){
  const rows = [['Date','Day','Class','Sport','Facility','Status']];
  STATE.entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const cls = byId(STATE.classes, e.class_id);
    const sp = byId(STATE.sports, e.sport_id);
    const fac = byId(STATE.facilities, e.facility_id);
    const dow = new Date(e.date+'T00:00:00').getDay();
    rows.push([e.date, DAYS[dow===0?6:dow-1], cls?cls.name:'', sp?sp.name:'', fac?fac.name:'', e.status]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pe-programme.csv';
  a.click();
}

   SETTINGS
   --------------------------------------------------------- */
function renderSettings(){
  const m = document.getElementById('main');
  m.appendChild(el(head('09 · Account','Settings',"Manage the current school's name, or switch between the schools on this account.")));

  if(!STATE.currentSchoolId || !STATE.school){
    m.appendChild(el(`<div class="panel"><h3>No school selected yet</h3>
      <div class="field" style="max-width:320px;"><label>School name</label><input type="text" id="firstSchoolName" placeholder="e.g. Greenfield International School"></div>
      <button class="btn" style="margin-top:12px;" onclick="createFirstSchool()">Create school</button></div>`));
    return;
  }

  const panel = el(`<div class="panel"><h3>Current school</h3>
    <div class="field" style="max-width:360px;"><label>School name</label><input type="text" id="schoolNameInput" value="${esc(STATE.school.name)}"></div>
    <button class="btn" style="margin-top:12px;" onclick="saveSchoolName()">Save</button>
  </div>`);
  m.appendChild(panel);

  const allPanel = el(`<div class="panel"><h3>All schools on this account (${STATE.schools.length})</h3>
    <table><thead><tr><th>Name</th><th></th></tr></thead><tbody id="allSchoolsBody"></tbody></table>
    <div class="row" style="margin-top:14px;">
      <div class="field"><label>New school name</label><input type="text" id="newSchoolName" placeholder="e.g. Riverside Primary"></div>
      <button class="btn secondary" style="align-self:flex-end;" onclick="addSchoolFromSettings()">+ Add school</button>
    </div>
  </div>`);
  m.appendChild(allPanel);
  const tbody = allPanel.querySelector('#allSchoolsBody');
  STATE.schools.forEach(s=>{
    const isCurrent = s.id===STATE.currentSchoolId;
    tbody.appendChild(el(`<tr>
      <td>${esc(s.name)||'<span class="hint">Unnamed school</span>'} ${isCurrent?'<span class="tag green">current</span>':''}</td>
      <td style="text-align:right;">
        ${isCurrent?'':`<button class="btn small secondary" onclick="switchSchool('${s.id}')">Switch to this school</button>`}
        <button class="btn small danger" onclick="deleteSchool('${s.id}')">Delete</button>
      </td>
    </tr>`));
  });

  const acc = el(`<div class="panel"><h3>Account</h3>
    <p class="mono" style="font-size:13px;">${esc(STATE.session.user.email)}</p>
    <button class="btn secondary" onclick="logout()">Log out</button>
  </div>`);
  m.appendChild(acc);

  const debugPanel = el(`<div class="panel"><h3>Diagnostics</h3>
    <div class="row">
      <button class="btn secondary small" onclick="runDiagnostics()">Run diagnostic check</button>
      <button class="btn secondary small" onclick="captureFacilitiesDom()">Capture live Facilities table HTML</button>
    </div>
    <pre id="diagOutput" class="mono" style="white-space:pre-wrap;font-size:12px;margin-top:12px;background:var(--paper);padding:10px;border-radius:6px;border:1px solid var(--line);display:none;word-break:break-all;"></pre>
  </div>`);
  m.appendChild(debugPanel);
}
async function runDiagnostics(){
  const out = document.getElementById('diagOutput');
  out.style.display='block';
  out.textContent = 'Running…';
  const lines = [];
  lines.push('Logged in as: ' + STATE.session.user.email);
  lines.push('Logged in user id: ' + STATE.session.user.id);
  lines.push('');
  lines.push('Current school id (in app memory): ' + STATE.currentSchoolId);
  lines.push('Current school name (in app memory): ' + (STATE.school ? STATE.school.name : 'null'));
  lines.push('');
  lines.push('Schools in app memory (' + STATE.schools.length + '):');
  STATE.schools.forEach(s=> lines.push('  - ' + s.id + '  "' + s.name + '"  owner=' + s.owner_id));
  lines.push('');
  lines.push('Classes in app memory (' + STATE.classes.length + '):');
  STATE.classes.forEach(c=> lines.push('  - ' + c.id + '  "' + c.name + '"  school_id=' + c.school_id));
  lines.push('');
  lines.push('--- Now querying Supabase directly (bypassing app memory) ---');
  const {data: liveSchools, error: schoolErr} = await sb.from('schools').select('*');
  lines.push('');
  lines.push('Live schools query error: ' + (schoolErr ? schoolErr.message : 'none'));
  lines.push('Live schools returned (' + (liveSchools?liveSchools.length:0) + '):');
  (liveSchools||[]).forEach(s=> lines.push('  - ' + s.id + '  "' + s.name + '"  owner=' + s.owner_id));
  const {data: liveClasses, error: classErr} = await sb.from('classes').select('*');
  lines.push('');
  lines.push('Live classes query error: ' + (classErr ? classErr.message : 'none'));
  lines.push('Live classes returned (' + (liveClasses?liveClasses.length:0) + '):');
  (liveClasses||[]).forEach(c=> lines.push('  - ' + c.id + '  "' + c.name + '"  school_id=' + c.school_id));
  lines.push('');
  lines.push('--- Live rendered DOM check ---');
  lines.push('navigator.userAgent: ' + navigator.userAgent);
  const testRow = el(`<tr><td>DOM-TEST-CELL-1</td><td>DOM-TEST-CELL-2</td></tr>`);
  lines.push('el() test — tagName: ' + (testRow ? testRow.tagName : 'NULL') + ', outerHTML: ' + (testRow ? testRow.outerHTML : 'N/A'));
  out.textContent = lines.join('\n');
}
async function captureFacilitiesDom(){
  const out = document.getElementById('diagOutput');
  out.style.display='block';
  out.style.whiteSpace = 'pre-wrap';
  const lines = [];
  lines.push('Building the Facilities table in a hidden test container (not navigating away)...');
  lines.push('');
  const testTbody = el(`<tbody></tbody>`);
  STATE.facilities.forEach(f=>{
    const usedBy = STATE.sportFacilities.filter(l=>l.facility_id===f.id).map(l=>byId(STATE.sports,l.sport_id)?.name).filter(Boolean);
    testTbody.appendChild(el(`<tr><td><b>${esc(f.name)}</b></td><td>${usedBy.length?esc(usedBy.join(', ')):'<span class="hint">not linked yet</span>'}</td>
      <td><button class="btn small danger" onclick="deleteRow('facilities','${f.id}')">Delete</button></td></tr>`));
  });
  lines.push('childElementCount: ' + testTbody.childElementCount);
  lines.push('children tags: ' + Array.from(testTbody.children).map(c=>c.tagName).join(', '));
  lines.push('');
  lines.push('--- Raw outerHTML ---');
  lines.push(testTbody.outerHTML);
  out.textContent = lines.join('\n');
}
async function saveSchoolName(){
  const name = document.getElementById('schoolNameInput').value.trim();
  const {error} = await sb.from('schools').upsert({id: STATE.currentSchoolId, owner_id: STATE.session.user.id, name});
  if(error){ alert(error.message); return; }
  await loadSchools();
  await loadAll();
  render();
}
async function addSchoolFromSettings(){
  const name = document.getElementById('newSchoolName').value.trim();
  await createSchool(name);
  render();
}
